<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTCGSim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            background-color: #2a1a0a;
        }

        /* The old procedural wood ::before / ::after layers were full-coverage
           absolute children that sat on top of the body background image and
           caused visible "brown bars" when the random image was set. They're
           no longer needed and are unconditionally suppressed. */
        body::before, body::after { content: none !important; display: none !important; }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Medieval parchment button base — same dimensions across all menu buttons */
        .btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            padding: 16px 0;
            background: linear-gradient(180deg, #f0dfa0 0%, #d8b860 50%, #c9a84c 100%);
            border: 2px solid #8b6914;
            border-radius: 6px;
            color: #3d1c02;
            font-family: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif;
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-shadow: 0 1px 0 rgba(255,255,255,0.35);
            cursor: pointer;
            text-align: center;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.45),
                inset 0 -2px 0 rgba(0,0,0,0.18),
                0 4px 10px rgba(0,0,0,0.55);
            transition: transform 0.08s ease, box-shadow 0.15s ease, border-color 0.15s ease, filter 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .btn:hover {
            filter: brightness(0.94);
            border-color: #f0c860;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.45),
                inset 0 -2px 0 rgba(0,0,0,0.18),
                0 0 14px 2px rgba(240,200,96,0.55),
                0 4px 12px rgba(0,0,0,0.6);
        }
        .btn:active {
            transform: translateX(-50%) scale(0.97);
            box-shadow:
                inset 0 2px 4px rgba(0,0,0,0.32),
                0 2px 5px rgba(0,0,0,0.45);
        }

        /* Per-button vertical placement only — sizing/typography come from .btn */
        .btn-multiplayer  { top: 30%; }
        .btn-solo         { top: 47%; }
        .btn-deck-editor  { top: 64%; }


        /* Version */
        .version {
            position: absolute;
            bottom: 8px;
            right: 16px;
            color: rgba(70, 45, 15, 0.45);
            font-size: 12px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Main buttons — use data-href so background.js's nav interceptor
             saves the music position before navigating. -->
        <button class="btn btn-multiplayer">Multiplayer</button>
        <button class="btn btn-solo" data-href="game.html?solo=true">Solo v Self</button>
        <button class="btn btn-deck-editor" data-href="deck-editor.html">Deck Editor</button>

        <!-- Version -->
        <div class="version">v 1.34c</div>
    </div>

    <script src="background.js?v=14"></script>
</body>
</html>
